<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esteira GitHub – Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Lista de Tarefas</h1>
    <p class="sub">Projeto de treino da esteira do GitHub</p>
    <form id="form">
      <input id="input" type="text" placeholder="Nova tarefa..." autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>
    <ul id="list"></ul>
    <p id="count" class="count"></p>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
